name: ll4ma
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.9  # Or 3.10, conda-forge will handle both safely
  - pip
  - numpy<2.0
  - scipy
  - pandas
  - matplotlib
  - scikit-learn
  - scikit-image
  - python-orocos-kdl
  - ompl
  - fcl
  - catkin_pkg
  - rospkg
  # MOVE problematic C++ packages here to be handled by Conda:
  - pybullet
  # NOTE: open3d is NOT here — conda-forge only ships open3d 0.18.0 for py>=3.10,
  # and the pip "open3d-cpu" wheel that some viser releases pulled in lacks
  # `visualization.rendering` (OffscreenRenderer). Pin the full pip wheel below.
  - pip:
    - trimesh
    - urdfpy
    - tensorboard
    - absl-py
    - loguru
    - pexpect
    - pyquaternion
    - config-path
    - setuptools_scm
    - tqdm
    - addict
    - timm
    - torcheval
    - viser
    - open3d==0.18.0  # full wheel: includes visualization.rendering.OffscreenRenderer